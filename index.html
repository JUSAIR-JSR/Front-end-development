<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programming Courses Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-blue: #00d0ff;
            --dark-bg: #0f172a;
            --darker-bg: #0a0f1c;
            --card-bg: rgba(30, 41, 59, 0.5);
        }
        
        body {
            background: linear-gradient(135deg, var(--darker-bg), var(--dark-bg));
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .course-card {
            transition: all 0.3s ease;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 208, 255, 0.15);
            border-color: rgba(0, 208, 255, 0.3);
        }
        
        .search-input {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 0 2px rgba(0, 208, 255, 0.2);
        }
        
        .category-btn {
            transition: all 0.3s ease;
            background: rgba(30, 41, 59, 0.5);
        }
        
        .category-btn.active, .category-btn:hover {
            background: rgba(0, 208, 255, 0.2);
            color: var(--neon-blue);
        }
        
        .neon-text {
            text-shadow: 0 0 8px rgba(0, 208, 255, 0.15), 0 0 18px rgba(0, 208, 255, 0.06);
        }
        
        .course-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 24px;
        }
        
        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        
        .stats-card {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 12px;
            padding: 1.5rem;
        }
        
        .course-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            background: rgba(0, 208, 255, 0.2);
            color: var(--neon-blue);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="mb-8 md:mb-12">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                <div>
                    <h1 class="text-3xl md:text-4xl font-bold text-white neon-text">Programming Courses</h1>
                    <p class="text-slate-400 mt-2">Master the technologies that power the modern web</p>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="relative flex-1 max-w-md">
                        <input type="text" id="searchInput" placeholder="Search courses..." 
                               class="w-full py-3 pl-10 pr-4 rounded-lg search-input text-white focus:outline-none">
                        <i class="fas fa-search absolute left-3 top-3.5 text-slate-400"></i>
                    </div>
                    
                    <div class="hidden md:flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-r from-cyan-500 to-blue-500 flex items-center justify-center text-white font-bold">
                            JS
                        </div>
                        <span class="text-white font-medium">Jusair</span>
                    </div>
                </div>
            </div>
            
            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="stats-card">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-slate-400 text-sm">Total Courses</p>
                            <h3 class="text-2xl font-bold text-white">19</h3>
                        </div>
                        <div class="w-12 h-12 rounded-lg bg-blue-500/20 flex items-center justify-center">
                            <i class="fas fa-book text-blue-400"></i>
                        </div>
                    </div>
                </div>
                
                <div class="stats-card">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-slate-400 text-sm">In Progress</p>
                            <h3 class="text-2xl font-bold text-white">3</h3>
                        </div>
                        <div class="w-12 h-12 rounded-lg bg-yellow-500/20 flex items-center justify-center">
                            <i class="fas fa-spinner text-yellow-400"></i>
                        </div>
                    </div>
                </div>
                
                <div class="stats-card">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-slate-400 text-sm">Completed</p>
                            <h3 class="text-2xl font-bold text-white">5</h3>
                        </div>
                        <div class="w-12 h-12 rounded-lg bg-green-500/20 flex items-center justify-center">
                            <i class="fas fa-check-circle text-green-400"></i>
                        </div>
                    </div>
                </div>
                
                <div class="stats-card">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-slate-400 text-sm">Hours Learned</p>
                            <h3 class="text-2xl font-bold text-white">127</h3>
                        </div>
                        <div class="w-12 h-12 rounded-lg bg-purple-500/20 flex items-center justify-center">
                            <i class="fas fa-clock text-purple-400"></i>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Categories -->
            <div class="flex flex-wrap gap-2 mb-2">
                <button class="category-btn active px-4 py-2 rounded-lg" data-category="all">All Courses</button>
                <button class="category-btn px-4 py-2 rounded-lg" data-category="frontend">Frontend</button>
                <button class="category-btn px-4 py-2 rounded-lg" data-category="backend">Backend</button>
                <button class="category-btn px-4 py-2 rounded-lg" data-category="database">Database</button>
                <button class="category-btn px-4 py-2 rounded-lg" data-category="language">Languages</button>
            </div>
        </header>
        
        <!-- Main Content -->
        <main>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5" id="coursesGrid">
                <!-- Courses will be dynamically inserted here -->
            </div>
            
            <!-- Recently Viewed Section -->
            <div class="mt-12">
                <h2 class="text-2xl font-bold text-white mb-6">Recently Viewed</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    <div class="course-card glass p-5 rounded-xl flex items-center gap-4">
                        <div class="course-icon bg-blue-500/20 text-blue-400">
                            <i class="fab fa-js"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold text-white">JavaScript</h3>
                            <p class="text-slate-400 text-sm">Last viewed: 2 hours ago</p>
                        </div>
                    </div>
                    
                    <div class="course-card glass p-5 rounded-xl flex items-center gap-4">
                        <div class="course-icon bg-green-500/20 text-green-400">
                            <i class="fab fa-node-js"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold text-white">Node.js</h3>
                            <p class="text-slate-400 text-sm">Last viewed: 1 day ago</p>
                        </div>
                    </div>
                    
                    <div class="course-card glass p-5 rounded-xl flex items-center gap-4">
                        <div class="course-icon bg-purple-500/20 text-purple-400">
                            <i class="fab fa-react"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold text-white">React</h3>
                            <p class="text-slate-400 text-sm">Last viewed: 3 days ago</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Course data
        const courses = [
            {
                id: 1,
                name: "HTML",
                filename: "./Htmlcourse.html",
                category: "frontend",
                icon: "fab fa-html5",
                color: "bg-orange-500/20 text-orange-400",
                progress: 100,
                description: "The standard markup language for Web pages"
            },
            {
                id: 2,
                name: "CSS",
                filename: "./Csscourse.html",
                category: "frontend",
                icon: "fab fa-css3-alt",
                color: "bg-blue-500/20 text-blue-400",
                progress: 100,
                description: "The language for styling web pages"
            },
            {
                id: 3,
                name: "JavaScript",
                filename: "./javascriptCourse.html",
                category: "frontend",
                icon: "fab fa-js",
                color: "bg-yellow-500/20 text-yellow-400",
                progress: 85,
                description: "Programming language of the Web"
            },
            {
                id: 4,
                name: "React",
                filename: "./Reactcourse.html",
                category: "frontend",
                icon: "fab fa-react",
                color: "bg-cyan-500/20 text-cyan-400",
                progress: 70,
                description: "A JavaScript library for building user interfaces"
            },
            {
                id: 5,
                name: "Bootstrap",
                filename: "./Boostrapcourse.html",
                category: "frontend",
                icon: "fab fa-bootstrap",
                color: "bg-purple-500/20 text-purple-400",
                progress: 100,
                description: "The most popular CSS Framework"
            },
            {
                id: 6,
                name: "Tailwind CSS",
                filename: "./tailwindcssCourse.html",
                category: "frontend",
                icon: "fas fa-wind",
                color: "bg-teal-500/20 text-teal-400",
                progress: 90,
                description: "A utility-first CSS framework"
            },
            {
                id: 7,
                name: "TypeScript",
                filename: "./TypeScriptCourse.html",
                category: "frontend",
                icon: "fas fa-code",
                color: "bg-blue-600/20 text-blue-500",
                progress: 60,
                description: "JavaScript with syntax for types"
            },
            {
                id: 8,
                name: "Next.js",
                filename: "./NextjsCourse.html",
                category: "frontend",
                icon: "fas fa-bolt",
                color: "bg-gray-500/20 text-gray-400",
                progress: 40,
                description: "The React Framework for Production"
            },
            {
                id: 9,
                name: "Node.js",
                filename: "./NodejsCourse.html",
                category: "backend",
                icon: "fab fa-node-js",
                color: "bg-green-500/20 text-green-400",
                progress: 75,
                description: "JavaScript runtime built on Chrome's V8 engine"
            },
            {
                id: 10,
                name: "Python",
                filename: "./PythonCourse.html",
                category: "language",
                icon: "fab fa-python",
                color: "bg-yellow-500/20 text-yellow-400",
                progress: 100,
                description: "A programming language that lets you work quickly"
            },
            {
                id: 11,
                name: "Django",
                filename: "./DjangoCourse.html",
                category: "backend",
                icon: "fas fa-leaf",
                color: "bg-green-600/20 text-green-500",
                progress: 65,
                description: "A high-level Python Web framework"
            },
            {
                id: 12,
                name: "Java",
                filename: "./JavaCourse.html",
                category: "language",
                icon: "fab fa-java",
                color: "bg-red-500/20 text-red-400",
                progress: 80,
                description: "A popular programming language"
            },
            {
                id: 13,
                name: "C Programming",
                filename: "./C_programming_Course.html",
                category: "language",
                icon: "fas fa-c",
                color: "bg-blue-700/20 text-blue-600",
                progress: 100,
                description: "A general-purpose programming language"
            },
            {
                id: 14,
                name: "C++ Programming",
                filename: "./CPP_course.html",
                category: "language",
                icon: "fas fa-plus",
                color: "bg-blue-800/20 text-blue-700",
                progress: 95,
                description: "C++ is a powerful general-purpose programming language"
            },
            {
                id: 15,
                name: "C#",
                filename: "./C_sharpCourse.html",
                category: "language",
                icon: "fas fa-hashtag",
                color: "bg-purple-600/20 text-purple-500",
                progress: 70,
                description: "A modern, object-oriented programming language"
            },
            {
                id: 16,
                name: "MySQL",
                filename: "./MySqlCourse.html",
                category: "database",
                icon: "fas fa-database",
                color: "bg-blue-500/20 text-blue-400",
                progress: 100,
                description: "The world's most popular open source database"
            },
            {
                id: 17,
                name: "PostgreSQL",
                filename: "./PostgreSqlCourse.html",
                category: "database",
                icon: "fas fa-database",
                color: "bg-blue-600/20 text-blue-500",
                progress: 85,
                description: "The world's most advanced open source database"
            },
            {
                id: 18,
                name: "MongoDB",
                filename: "./MongoDbCourse.html",
                category: "database",
                icon: "fas fa-leaf",
                color: "bg-green-500/20 text-green-400",
                progress: 60,
                description: "The most popular database for modern apps"
            },
            {
                id: 19,
                name: "Git",
                filename: "./GitCourse.html",
                category: "backend",
                icon: "fab fa-git-alt",
                color: "bg-orange-500/20 text-orange-400",
                progress: 100,
                description: "A free and open source distributed version control system"
            }
        ];

        // DOM elements
        const coursesGrid = document.getElementById('coursesGrid');
        const searchInput = document.getElementById('searchInput');
        const categoryButtons = document.querySelectorAll('.category-btn');

        // Initialize the dashboard
        function initDashboard() {
            renderCourses(courses);
            setupEventListeners();
        }

        // Render courses to the grid
        function renderCourses(coursesToRender) {
            coursesGrid.innerHTML = '';
            
            coursesToRender.forEach((course, index) => {
                const courseCard = document.createElement('div');
                courseCard.className = `course-card glass p-5 rounded-xl fade-in`;
                courseCard.style.animationDelay = `${index * 0.05}s`;
                
                // Progress bar color based on completion
                let progressColor = 'bg-red-500';
                if (course.progress >= 80) progressColor = 'bg-green-500';
                else if (course.progress >= 50) progressColor = 'bg-yellow-500';
                
                courseCard.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="course-icon ${course.color}">
                            <i class="${course.icon}"></i>
                        </div>
                        <span class="course-badge">${course.category}</span>
                    </div>
                    
                    <h3 class="font-bold text-white text-lg mb-2">${course.name}</h3>
                    <p class="text-slate-400 text-sm mb-4">${course.description}</p>
                    
                    <div class="mb-4">
                        <div class="flex justify-between text-sm mb-1">
                            <span class="text-slate-400">Progress</span>
                            <span class="text-white">${course.progress}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill ${progressColor}" style="width: ${course.progress}%"></div>
                        </div>
                    </div>
                    
                    <a href="${course.filename}" class="block w-full py-2 text-center rounded-lg bg-slate-700/50 hover:bg-slate-600/50 text-white transition-colors">
                        ${course.progress === 100 ? 'Review Course' : 'Continue Learning'}
                    </a>
                `;
                
                coursesGrid.appendChild(courseCard);
            });
        }

        // Filter courses based on search and category
        function filterCourses() {
            const searchTerm = searchInput.value.toLowerCase();
            const activeCategory = document.querySelector('.category-btn.active').dataset.category;
            
            const filteredCourses = courses.filter(course => {
                const matchesSearch = course.name.toLowerCase().includes(searchTerm) || 
                                     course.description.toLowerCase().includes(searchTerm);
                const matchesCategory = activeCategory === 'all' || course.category === activeCategory;
                
                return matchesSearch && matchesCategory;
            });
            
            renderCourses(filteredCourses);
        }

        // Set up event listeners
        function setupEventListeners() {
            // Search functionality
            searchInput.addEventListener('input', filterCourses);
            
            // Category filtering
            categoryButtons.forEach(button => {
                button.addEventListener('click', () => {
                    categoryButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    filterCourses();
                });
            });
        }

        // Initialize the dashboard when the page loads
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
